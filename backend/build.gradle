plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sleepwell'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 17
}

tasks.withType(Test).configureEach {
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

tasks.withType(JavaExec).configureEach {
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

// 메인 클래스 명시 (RAG 전용 앱 제외)
springBoot {
	mainClass = 'com.sleepwell.sleepwell_backend.SleepWellBackendApiApplication'
}

repositories {
	mavenCentral()
	maven { url = uri("https://repo.spring.io/milestone") }
	maven { url = uri("https://repo.spring.io/snapshot") }
	maven { url = uri("https://jitpack.io") } // 토스페이먼츠 SDK를 위한 JitPack 추가
}

dependencies {
	// Spring Boot Starters
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'

	// Caffeine Cache - 고성능 메모리 캐시 (TTL + 크기 제한 지원)
	implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

	// Rate Limiting (Bucket4j)
	implementation 'com.bucket4j:bucket4j-core:8.1.0'
	implementation 'com.bucket4j:bucket4j-jcache:8.1.0'

	// Resilience4j for Rate Limiting & Circuit Breaker
	implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.1.0'
	implementation 'io.github.resilience4j:resilience4j-micrometer:2.1.0'

	// Database
	testRuntimeOnly 'com.h2database:h2' // Only for testing
	runtimeOnly 'com.h2database:h2' // For bootRun (rag/local)
	runtimeOnly 'mysql:mysql-connector-java:8.0.33' // Production

	// Database Migration (Flyway)
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'

	// Hypersistence Utils - JSON Type support for Hibernate
	implementation 'io.hypersistence:hypersistence-utils-hibernate-63:3.8.2'
	
	// JWT Authentication
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	
	// SpringDoc OpenAPI BOM - 호환성 보장
	implementation platform('org.springdoc:springdoc-openapi:2.7.0')

	// Swagger/OpenAPI - BOM으로 버전 관리
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui'
	
	// Spring AI BOM (최신 안정 버전)
	implementation platform("org.springframework.ai:spring-ai-bom:1.0.3")
	
	// Spring AI - OpenAI, Anthropic Claude, and Google Vertex AI Gemini support (새로운 네이밍 컨벤션)
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'
	implementation 'org.springframework.ai:spring-ai-starter-model-vertex-ai-gemini'
	
	// Environment Variables (.env file support)
	implementation 'me.paulschwarz:spring-dotenv:4.0.0'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Testing
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	
	// REST Assured for API Testing
	testImplementation 'io.rest-assured:rest-assured:5.4.0'
	testImplementation 'io.rest-assured:json-path:5.4.0'
	testImplementation 'io.rest-assured:xml-path:5.4.0'

	// OAuth2 Client
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	// Firebase Admin SDK for FCM
	implementation 'com.google.firebase:firebase-admin:9.2.0'

	// AWS S3 for ASMR file storage (Spring Cloud AWS 3.x with BOM)
	implementation platform('io.awspring.cloud:spring-cloud-aws-dependencies:3.2.1')
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3'

	// HTML Sanitization (XSS Protection)
	implementation 'org.jsoup:jsoup:1.18.1'

	// WebFlux for async file processing
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// 결제 관련 SDK
	 implementation 'com.github.iamport:iamport-rest-client-java:0.2.23' // 아임포트 SDK - 실제 SDK 사용시 주석 해제

	// RAG (Retrieval-Augmented Generation) 관련 의존성
	// Spring AI Vector Store - Qdrant 연동 (auto-configuration 포함)
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-qdrant'

	// Apache Lucene - Sparse 검색 엔진
	implementation 'org.apache.lucene:lucene-core:9.9.1'
	implementation 'org.apache.lucene:lucene-queryparser:9.9.1'
	implementation 'org.apache.lucene:lucene-analysis-common:9.9.1'
	implementation 'org.apache.lucene:lucene-analysis-nori:9.9.1' // 한국어 형태소 분석
	implementation 'org.apache.lucene:lucene-highlighter:9.9.1' // 하이라이팅

	// Apache PDFBox - PDF 문서 처리 (2.x - API 호환성)
	implementation 'org.apache.pdfbox:pdfbox:2.0.30'

	// Apache Tika - 다양한 문서 형식 추출
	implementation 'org.apache.tika:tika-core:2.9.1'
	implementation 'org.apache.tika:tika-parsers-standard-package:2.9.1'

	// Apache Commons IO - 파일 유틸리티
	implementation 'commons-io:commons-io:2.15.1'
}

tasks.named('test') {
	useJUnitPlatform()
}

