spring:
  config:
    activate:
      on-profiles: rag

  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:${OPENAI_API_KEY:dummy-key-for-testing}}
      embedding:
        options:
          model: text-embedding-3-large  # 3072차원 고정
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}  # Docker: qdrant, Local: localhost
        port: 6334
        collection-name: vector_store
        initialize-schema: true

  # ⚠️  autoconfigure.exclude는 rag 프로필 단독 실행 시에만 적용
  # docker,rag 함께 사용 시에는 Security가 필요하므로 제외하지 않음

server:
  port: 8080

logging:
  level:
    root: info
    io.qdrant.client: warn
    com.sleepwell.sleepwell_backend.rag: debug   # RAG 디버깅 로그
    org.apache.tika: warn
    org.apache.pdfbox: warn

rag:
  retrieval:
    dense:
      topKInit: 30  # 60→30 (Rerank 20과 충분한 여유, 안정성 우선)
    sparse:
      topKInit: 60
    mmr:
      enabled: true
      k: 25
      lambda: 0.45
    hybrid:
      rrfK: 60
    rerank:
      enabled: true
      topK: 20

  guard:
    yearMin: 2015
    redFlags:
      - "자살"
      - "극심한 호흡곤란"
      - "흉통"
      - "임신 합병증"
      - "아동"
      - "학대"

  sparse:
    indexPath: ./build/rag-lucene          # 루씬 인덱스 위치
    corpusPath: ${RAG_CORPUS_PATH:./rag-corpus}  # PDF 등 원문 폴더 (환경변수로 외부화)
    rebuildOnStart: false                  # 관리자가 수동으로 인덱싱 (API 사용)
    namespace:
      fromPath: true                       # rag_pdf/<namespace>/... 폴더명을 네임스페이스로 사용
    chunk:
      size: 1200
      overlap: 200

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
          - mappings
